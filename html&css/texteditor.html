<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live HTML/CSS Editor</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      height: 100vh;
      font-family: Arial, sans-serif;
    }

    /* Left: Output pane */
    #output {
      flex: 1;
      border-right: 2px solid #ccc;
      background: #f8f8f8;
    }

    /* Right: Editor pane */
    #editor {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 10px;
      box-sizing: border-box;
    }

    textarea {
      flex: 1;
      width: 100%;
      margin-bottom: 10px;
      font-family: monospace;
      font-size: 14px;
      resize: none;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    h2 {
      margin: 0 0 5px 0;
      font-size: 16px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Left: Live Preview -->
  <div id="output">
    <iframe id="liveFrame"></iframe>
  </div>

  <!-- Right: Code Editor -->
  <div id="editor">
    <h2>HTML</h2>
    <textarea id="htmlCode" placeholder="Write your HTML here..."></textarea>

    <h2>CSS</h2>
    <textarea id="cssCode" placeholder="Write your CSS here..."></textarea>
  </div>

  <script>
    const htmlInput = document.getElementById('htmlCode');
    const cssInput = document.getElementById('cssCode');
    const iframe = document.getElementById('liveFrame');

    function updatePreview() {
      const html = htmlInput.value;
      const css = `<style>${cssInput.value}</style>`;
      const content = `${css}\n${html}`;
      iframe.srcdoc = content;
    }

    htmlInput.addEventListener('input', updatePreview);
    cssInput.addEventListener('input', updatePreview);

    // Initial content
    htmlInput.value = "<h1>Hello, World!</h1>\n<p>Edit the HTML and CSS to see changes.</p>";
    cssInput.value = "";
    updatePreview();
  </script>

</body>
</html>
